AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Shared network layer for service-launcher: VPC across two AZs with public
  and private subnets. Deployed once per environment.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC.

  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/24

  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.10.0/24

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.11.0/24

  EnableNatGateway:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Set true to give private subnets outbound internet access through a NAT
      Gateway. Costs money whether or not it is used. VPC endpoints cover SSM
      and S3 without it; only enable this if a service needs to reach the
      open internet.

  CertificateArn:
    Type: String
    Default: ''
    Description: >
      ACM certificate ARN used for the HTTPS listener on both the public and
      internal ALB. Leave empty to run HTTP only; issuing the certificate is
      a manual step outside this stack.

  CreateDatabase:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Set true to create a shared PostgreSQL instance. Costs money whether or
      not a service uses it; only enable this once a service needs it.

  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: Instance class for the PostgreSQL instance, only used when CreateDatabase is true.

  DatabaseName:
    Type: String
    Default: app
    Description: Initial database name, only used when CreateDatabase is true.

  DatabaseAllocatedStorage:
    Type: Number
    Default: 20
    Description: Allocated storage in GiB, only used when CreateDatabase is true.

  DatabaseEngineVersion:
    Type: String
    Default: '16'
    Description: >
      PostgreSQL major version, only used when CreateDatabase is true. Also
      selects the DB parameter group family, which must match.

Conditions:
  CreateNatGateway: !Equals [!Ref EnableNatGateway, 'true']
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  ShouldCreateDatabase: !Equals [!Ref CreateDatabase, 'true']

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # One route table per AZ so each private subnet can get its own NAT
  # Gateway. A single shared table would force both AZs through one NAT
  # Gateway, which is a cross-AZ hop and a single point of failure for an
  # opt-in resource, contrary to the multi-AZ rule in CLAUDE.md.
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-2

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # One NAT Gateway per AZ, each with its own EIP, so private subnets egress
  # within their own AZ instead of crossing AZs to a single shared gateway.
  # This doubles the NAT Gateway hourly charge versus one shared gateway,
  # accepted per the multi-AZ rule for opt-in resources in CLAUDE.md.
  NatGatewayEIP1:
    Type: AWS::EC2::EIP
    Condition: CreateNatGateway
    Properties:
      Domain: vpc

  NatGatewayEIP2:
    Type: AWS::EC2::EIP
    Condition: CreateNatGateway
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: CreateNatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat-1

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: CreateNatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat-2

  PrivateRoute1:
    Type: AWS::EC2::Route
    Condition: CreateNatGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateRoute2:
    Type: AWS::EC2::Route
    Condition: CreateNatGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

  # Gateway endpoint, no hourly charge. Covers S3 access from both route
  # tables so instances without a NAT Gateway can still pull from S3.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from inside the VPC to interface endpoints
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpce

  # Interface endpoints, billed per hour plus data processed. These three
  # are what let instances in private subnets reach SSM (for Session Manager
  # access, replacing a bastion or NAT) without a NAT Gateway.
  SsmInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  SsmMessagesInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  Ec2MessagesInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ec2messages
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  # Chain: internet -> public ALB -> instances -> database. Each group only
  # opens ports to the specific group in front of it, per the narrowest-scope
  # rule in CLAUDE.md, rather than to a CIDR range that would also let
  # instances reach each other directly.
  PublicAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ALB, open to the internet on HTTP and HTTPS
      VpcId: !Ref VPC
      # Egress restricted to the instance tier. CloudFormation's default is
      # allow-all outbound, which an auditor reads as a finding.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCidr
          Description: Forward to service instances
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-alb

  InternalAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB, open to the VPC on HTTP and HTTPS
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCidr
          Description: Forward to service instances
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-internal-alb

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Service instances, open only to the two ALBs
      VpcId: !Ref VPC
      # Egress restricted to what an instance actually needs: the interface
      # endpoints for SSM, and the internet only when a NAT Gateway exists to
      # route it. The 5432 rule to the database lives in a separate
      # AWS::EC2::SecurityGroupEgress resource below, since embedding a
      # reference to DatabaseSecurityGroup here would make this group and
      # DatabaseSecurityGroup depend on each other and CloudFormation cannot
      # create a circular dependency. CloudFormation's default is allow-all
      # outbound, which an auditor reads as a finding.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: SSM, ssmmessages, ec2messages interface endpoints
        - !If
          - CreateNatGateway
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: 0.0.0.0/0
            Description: Internet egress via NAT Gateway
          - !Ref AWS::NoValue
        - !If
          - CreateNatGateway
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0
            Description: Internet egress via NAT Gateway
          - !Ref AWS::NoValue
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref PublicAlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref InternalAlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-instance

  InstanceToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      Description: PostgreSQL

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL, open only to service instances
      VpcId: !Ref VPC
      # A database has no reason to originate outbound traffic. Denying it
      # removes the exfiltration path a compromised instance would use.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: No outbound; placeholder rule replaces the default allow-all
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-database

  # Both ALBs default every listener to a 404 fixed response. Services attach
  # their own listener rules with host-header conditions; a request that
  # matches no service should get a plain 404, not fall through to whatever
  # service happens to be first.
  PublicAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${AWS::StackName}-public
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref PublicAlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  PublicAlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PublicAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: no service matched this host

  PublicAlbHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref PublicAlb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: no service matched this host

  InternalAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${AWS::StackName}-internal
      Type: application
      Scheme: internal
      SecurityGroups:
        - !Ref InternalAlbSecurityGroup
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-internal

  InternalAlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: no service matched this host

  InternalAlbHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref InternalAlb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: no service matched this host

  # Opt-in resource, so it gets the multi-AZ treatment per the CLAUDE.md rule
  # for anything a user turns on deliberately: someone enabling a database is
  # running something real, and a second instance is cheaper than the outage
  # a single AZ would eventually cause. The instance class itself still
  # defaults to the cheap db.t4g.micro.
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: ShouldCreateDatabase
    Properties:
      DBSubnetGroupDescription: Private subnets for the PostgreSQL instance
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Condition: ShouldCreateDatabase
    Properties:
      Description: Master credentials for the shared PostgreSQL instance
      GenerateSecretString:
        SecretStringTemplate: '{"username": "postgres"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  # rds.force_ssl rejects any connection that does not negotiate TLS.
  # StorageEncrypted above only covers data at rest; without this, a client
  # can still connect in plaintext.
  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Condition: ShouldCreateDatabase
    Properties:
      Description: Forces TLS on every connection to the shared PostgreSQL instance
      Family: !Sub postgres${DatabaseEngineVersion}
      Parameters:
        rds.force_ssl: '1'

  Database:
    Type: AWS::RDS::DBInstance
    Condition: ShouldCreateDatabase
    Properties:
      Engine: postgres
      EngineVersion: !Ref DatabaseEngineVersion
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBParameterGroupName: !Ref DatabaseParameterGroup
      MultiAZ: true
      DBName: !Ref DatabaseName
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-database

  DatabaseSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Condition: ShouldCreateDatabase
    Properties:
      SecretId: !Ref DatabaseSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

Outputs:
  VpcId:
    Value: !Ref VPC
    Export:
      Name: !Sub ${AWS::StackName}-VpcId

  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub ${AWS::StackName}-PublicSubnet1Id

  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub ${AWS::StackName}-PublicSubnet2Id

  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet1Id

  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet2Id

  InstanceSecurityGroupId:
    Value: !Ref InstanceSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-InstanceSecurityGroupId

  PublicAlbListenerArn:
    Value: !Ref PublicAlbHttpListener
    Export:
      Name: !Sub ${AWS::StackName}-PublicAlbListenerArn

  InternalAlbListenerArn:
    Value: !Ref InternalAlbHttpListener
    Export:
      Name: !Sub ${AWS::StackName}-InternalAlbListenerArn

  # Only exported when a certificate is configured, so a service that opts
  # into UseHttps against a shared stack with no certificate fails at
  # ImportValue rather than silently falling back to plaintext.
  PublicAlbHttpsListenerArn:
    Condition: HasCertificate
    Value: !Ref PublicAlbHttpsListener
    Export:
      Name: !Sub ${AWS::StackName}-PublicAlbHttpsListenerArn

  InternalAlbHttpsListenerArn:
    Condition: HasCertificate
    Value: !Ref InternalAlbHttpsListener
    Export:
      Name: !Sub ${AWS::StackName}-InternalAlbHttpsListenerArn

  PublicAlbDnsName:
    Value: !GetAtt PublicAlb.DNSName
    Export:
      Name: !Sub ${AWS::StackName}-PublicAlbDnsName

  PublicAlbCanonicalHostedZoneId:
    Value: !GetAtt PublicAlb.CanonicalHostedZoneID
    Export:
      Name: !Sub ${AWS::StackName}-PublicAlbCanonicalHostedZoneId

  InternalAlbDnsName:
    Value: !GetAtt InternalAlb.DNSName
    Export:
      Name: !Sub ${AWS::StackName}-InternalAlbDnsName

  InternalAlbCanonicalHostedZoneId:
    Value: !GetAtt InternalAlb.CanonicalHostedZoneID
    Export:
      Name: !Sub ${AWS::StackName}-InternalAlbCanonicalHostedZoneId

  # The app/name/id form CloudWatch metrics use for the LoadBalancer
  # dimension, not the DNS name. Per-service dashboards and alarms need this
  # to address ALB-level metrics for their own target group.
  PublicAlbFullName:
    Value: !GetAtt PublicAlb.LoadBalancerFullName
    Export:
      Name: !Sub ${AWS::StackName}-PublicAlbFullName

  InternalAlbFullName:
    Value: !GetAtt InternalAlb.LoadBalancerFullName
    Export:
      Name: !Sub ${AWS::StackName}-InternalAlbFullName

  DatabaseEndpoint:
    Condition: ShouldCreateDatabase
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-DatabaseEndpoint

  DatabaseSecretArn:
    Condition: ShouldCreateDatabase
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub ${AWS::StackName}-DatabaseSecretArn
