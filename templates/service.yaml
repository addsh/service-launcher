AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Per-service resources: target group, listener rule, IAM role, and launch
  template. Deployed as a nested stack, one per entry in services.yaml.

Parameters:
  SharedStackName:
    Type: String
    Description: Name of the deployed shared.yaml stack, used to import its exports.

  ServiceName:
    Type: String
    Description: Name of the service, used to tag and name resources.

  Port:
    Type: Number
    Default: 80
    Description: Port the service listens on.

  HealthCheckPath:
    Type: String
    Default: /
    Description: Path the target group polls for health checks.

  HostHeader:
    Type: String
    Description: Host header value that routes traffic to this service.

  Exposure:
    Type: String
    AllowedValues: [public, internal]
    Default: public
    Description: Which shared ALB the listener rule attaches to.

  Priority:
    Type: Number
    Description: >
      Listener rule priority. Must be unique per listener; generate.py
      assigns this by position since CloudFormation cannot compute it.

  InstanceType:
    Type: String
    Default: t3.micro
    Description: Instance type launched by the launch template.

  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >
      AMI id, resolved at launch time from the SSM public parameter for the
      latest Amazon Linux 2023 image so the template never pins a stale AMI.

  RootVolumeSize:
    Type: Number
    Default: 8
    Description: Root EBS volume size in GiB.

  MinSize:
    Type: Number
    Default: 1
    Description: Minimum number of instances in the autoscaling group.

  MaxSize:
    Type: Number
    Default: 3
    Description: Maximum number of instances in the autoscaling group.

  TargetCpuUtilization:
    Type: Number
    Default: 60
    Description: Target average CPU percent the scaling policy holds the group to.

  HostedZoneId:
    Type: String
    Default: ''
    Description: >
      Route 53 hosted zone id to create an alias record for HostHeader in.
      Leave empty to skip DNS and point it at the ALB some other way.

  Repo:
    Type: String
    Default: ''
    Description: >
      GitHub owner/repo to build on every push. Leave empty to skip
      CodePipeline and CodeBuild entirely.

  CodeStarConnectionArn:
    Type: String
    Default: ''
    Description: >
      ARN of the CodeStar Connection authorizing access to Repo. Required
      when Repo is set; see the README for the manual console handshake this
      needs.

  BranchName:
    Type: String
    Default: main
    Description: Branch CodePipeline builds from.

  BuildComputeType:
    Type: String
    Default: BUILD_GENERAL1_SMALL
    Description: CodeBuild compute size.

Conditions:
  IsPublic: !Equals [!Ref Exposure, public]
  IsRootHealthCheck: !Equals [!Ref HealthCheckPath, /]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]
  HasRepo: !Not [!Equals [!Ref Repo, '']]

Resources:
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ServiceName}-tg
      VpcId: !ImportValue
        Fn::Sub: ${SharedStackName}-VpcId
      Port: !Ref Port
      Protocol: HTTP
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Ref ServiceName

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If
        - IsPublic
        - !ImportValue
          Fn::Sub: ${SharedStackName}-PublicAlbListenerArn
        - !ImportValue
          Fn::Sub: ${SharedStackName}-InternalAlbListenerArn
      Priority: !Ref Priority
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref HostHeader
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # Instances have no other way in: there is no bastion and NAT Gateway is
  # off by default. AmazonSSMManagedInstanceCore paired with the SSM VPC
  # endpoints in shared.yaml gives Session Manager access instead.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ServiceName}-instance-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Ref ServiceName

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${ServiceName}-lt
      LaunchTemplateData:
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        # IMDSv2 required, per CLAUDE.md.
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: ${SharedStackName}-InstanceSecurityGroupId
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref RootVolumeSize
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Ref ServiceName
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                dnf install -y nginx
                systemctl enable nginx
                ${HealthCheckSetup}
                systemctl start nginx
              - HealthCheckSetup: !If
                  # The default "/" already returns 200 from nginx's stock
                  # index page. Anything else is written as a single file, so
                  # this does not handle a custom path that ends in "/".
                  - IsRootHealthCheck
                  - ''
                  - !Sub |
                      mkdir -p "/usr/share/nginx/html$(dirname "${HealthCheckPath}")"
                      echo ok > "/usr/share/nginx/html${HealthCheckPath}"

  # Private subnets: instances are never reached directly, only through the
  # ALB, so they have no need of a public IP.
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${ServiceName}-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      VPCZoneIdentifier:
        - !ImportValue
          Fn::Sub: ${SharedStackName}-PrivateSubnet1Id
        - !ImportValue
          Fn::Sub: ${SharedStackName}-PrivateSubnet2Id
      TargetGroupARNs:
        - !Ref TargetGroup
      # ELB health checks, not just EC2 status checks, so an instance that
      # boots fine but fails the target group health check still gets
      # replaced.
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      Tags:
        - Key: Name
          Value: !Ref ServiceName
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT5M
        WaitOnResourceSignals: false

  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref TargetCpuUtilization

  # Optional: a service with no hosted zone still works, just reached by the
  # ALB DNS name directly instead of HostHeader.
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref HostHeader
      Type: A
      AliasTarget:
        DNSName: !If
          - IsPublic
          - !ImportValue
            Fn::Sub: ${SharedStackName}-PublicAlbDnsName
          - !ImportValue
            Fn::Sub: ${SharedStackName}-InternalAlbDnsName
        HostedZoneId: !If
          - IsPublic
          - !ImportValue
            Fn::Sub: ${SharedStackName}-PublicAlbCanonicalHostedZoneId
          - !ImportValue
            Fn::Sub: ${SharedStackName}-InternalAlbCanonicalHostedZoneId
        EvaluateTargetHealth: true

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${ServiceName}-dashboard
      DashboardBody:
        Fn::Sub:
          - |
            {
              "widgets": [
                {
                  "type": "metric",
                  "x": 0, "y": 0, "width": 8, "height": 6,
                  "properties": {
                    "title": "5xx count",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "stat": "Sum",
                    "period": 60,
                    "metrics": [
                      ["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "TargetGroup", "${TargetGroupFullName}", "LoadBalancer", "${AlbFullName}"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 8, "y": 0, "width": 8, "height": 6,
                  "properties": {
                    "title": "Target response time",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "stat": "Average",
                    "period": 60,
                    "metrics": [
                      ["AWS/ApplicationELB", "TargetResponseTime", "TargetGroup", "${TargetGroupFullName}", "LoadBalancer", "${AlbFullName}"]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 16, "y": 0, "width": 8, "height": 6,
                  "properties": {
                    "title": "In-service instances",
                    "view": "timeSeries",
                    "region": "${AWS::Region}",
                    "stat": "Average",
                    "period": 60,
                    "metrics": [
                      ["AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AutoScalingGroupName}"]
                    ]
                  }
                }
              ]
            }
          - TargetGroupFullName: !GetAtt TargetGroup.TargetGroupFullName
            AlbFullName: !If
              - IsPublic
              - !ImportValue
                Fn::Sub: ${SharedStackName}-PublicAlbFullName
              - !ImportValue
                Fn::Sub: ${SharedStackName}-InternalAlbFullName
            AutoScalingGroupName: !Ref AutoScalingGroup

  # Source and build only, no deploy stage. Wiring the build output into the
  # ASG (CodeDeploy or an instance refresh) is a separate task; today this
  # pipeline builds on every push and stops there.
  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Condition: HasRepo
    Properties:
      BucketName: !Sub ${ServiceName}-pipeline-artifacts-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      # Build artifacts are disposable; nothing needs to keep old versions
      # around once CodePipeline has moved past them.
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasRepo
    Properties:
      LogGroupName: !Sub /aws/codebuild/${ServiceName}
      RetentionInDays: 14

  CodeBuildRole:
    Type: AWS::IAM::Role
    Condition: HasRepo
    Properties:
      RoleName: !Sub ${ServiceName}-codebuild-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildLogsAndArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CodeBuildLogGroup.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${PipelineArtifactBucket.Arn}/*

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Condition: HasRepo
    Properties:
      Name: !Sub ${ServiceName}-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        # buildspec.yml lives in Repo, not here; this launcher has no
        # knowledge of how a given service builds itself.
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref BuildComputeType
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref CodeBuildLogGroup

  PipelineRole:
    Type: AWS::IAM::Role
    Condition: HasRepo
    Properties:
      RoleName: !Sub ${ServiceName}-pipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineArtifactsAndBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt PipelineArtifactBucket.Arn
                  - !Sub ${PipelineArtifactBucket.Arn}/*
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref CodeStarConnectionArn
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt CodeBuildProject.Arn

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Condition: HasRepo
    Properties:
      Name: !Sub ${ServiceName}-pipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Ref Repo
                BranchName: !Ref BranchName
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
