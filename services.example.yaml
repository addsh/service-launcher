# Copy this to services.yaml and edit. services.yaml is gitignored because
# it holds user-specific configuration, not something to commit.
#
# generate.py reads the "services" list below and emits one nested stack per
# entry. Only "name" and "host_header" are required; everything else has a
# default in templates/service.yaml and can be left out.
services:
  # Minimal entry: exposure defaults to public, and every other setting
  # comes from templates/service.yaml's parameter defaults.
  - name: hello
    host_header: hello.example.com

  # Fully specified entry, overriding every optional field.
  - name: api
    host_header: api.example.com
    port: 8080
    health_check_path: /healthz
    exposure: public
    instance_type: t3.small
    image_id: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    root_volume_size: 20
    min_capacity: 2
    max_capacity: 4
    desired_capacity: 2
    target_cpu_utilization: 50
    hosted_zone_id: Z0123456789ABCDEFGHIJ

  # Internal service: attaches to the internal ALB instead of the public
  # one, so it is only reachable from inside the VPC.
  - name: admin
    host_header: admin.internal.example.com
    exposure: internal
