# Copy this to services.yaml and edit. services.yaml is gitignored since it
# holds your own config, not a template.

sharedStackName: launcher-shared
domainName: example.internal

# Only needed if any service below sets repo. See the README for the manual
# console steps that produce this ARN; CloudFormation cannot create it.
codeStarConnectionArn: arn:aws:codestar-connections:ap-south-1:111111111111:connection/abcd1234

services:
  # Minimal: only a name is required. Everything else falls back to the
  # defaults in templates/service.yaml (port 80, health check on /, exposure
  # public, one t3.micro instance scaling between 1 and 3).
  - name: orders-api

  # Fully specified.
  - name: payments-api
    port: 8080
    healthCheckPath: /healthz
    hostHeader: payments.example.internal
    exposure: public
    instanceType: t3.small
    minSize: 2
    maxSize: 4
    hostedZoneId: Z1234567890ABC
    # ec2 or ecs, defaults to ec2. ecs is validated but not implemented yet:
    # generate.py rejects it until templates/service-ecs.yaml exists.
    compute: ec2
    # Owner/repo, validated by generate.py. Setting this creates a
    # CodePipeline and CodeBuild project that builds this branch on every
    # push, using codeStarConnectionArn above to authorize GitHub access.
    repo: example-org/payments-api
    branch: main
    # Creates a dedicated encrypted PostgreSQL instance for this service,
    # with credentials in Secrets Manager. Defaults to false. See
    # templates/service-database.yaml.
    database: true
    # Creates a dedicated single-node encrypted Valkey cluster for this
    # service. Defaults to false. See templates/service-cache.yaml.
    cache: true

  # Internal: routed through the internal ALB instead of the public one, so
  # it is reachable only from inside the VPC.
  - name: reconciliation-worker
    exposure: internal
