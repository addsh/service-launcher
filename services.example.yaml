# Copy this to services.yaml and edit. services.yaml is gitignored since it
# holds your own config, not a template.

sharedStackName: launcher-shared
domainName: example.internal

services:
  # Minimal: only a name is required. Everything else falls back to the
  # defaults in templates/service.yaml (port 80, health check on /, exposure
  # public, one t3.micro instance scaling between 1 and 3).
  - name: orders-api

  # Fully specified.
  - name: payments-api
    port: 8080
    healthCheckPath: /healthz
    hostHeader: payments.example.internal
    exposure: public
    instanceType: t3.small
    minSize: 2
    maxSize: 4
    hostedZoneId: Z1234567890ABC

  # Internal: routed through the internal ALB instead of the public one, so
  # it is reachable only from inside the VPC.
  - name: reconciliation-worker
    exposure: internal
