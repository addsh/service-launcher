name: Daily Build

on:
  schedule:
    - cron: "17 4 * * 1-5"
    - cron: "42 9 * * 1-5"
    - cron: "8 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "Aditya Deshpande"
          GIT_AUTHOR_EMAIL: "addsh10@gmail.com"
          GIT_COMMITTER_NAME: "Aditya Deshpande"
          GIT_COMMITTER_EMAIL: "addsh10@gmail.com"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"
          prompt: |
            Read CLAUDE.md, then TASKS.md.

            Take the first unchecked task under "## Backlog", then keep taking
            the following tasks in order for as long as they are independent
            of each other, up to five in one run. Stop early if a task depends
            on one you have not done, or is large enough to fill the run.

            Then:
            1. Create a branch named daily/<short-slug-of-first-task>.
            2. Do the work, one commit per task.
            3. Move each completed task from "## Backlog" to "## Done" and
               tick its checkbox.
            4. Push: git push -u origin HEAD
            5. Open a pull request:
               gh pr create --base main --head <branch> --title "..." --body "..."
               Explain what you did, the design decision and why, and anything
               you were unsure about.
            6. Merge it: gh pr merge <number> --merge --delete-branch

            Rules:
            - Never push to main. Always open a pull request first.
            - If the backlog is empty, stop and do nothing. Do not invent work.
            - Never edit files under .github/workflows/. The token cannot push
              them. Skip any task requiring it and note the skip.
            - Follow the writing style rules in CLAUDE.md.
