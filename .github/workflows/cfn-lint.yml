name: cfn-lint

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      # Runs on every pull request, not only template changes. A required
      # check that is skipped never reports, and branch protection then
      # blocks the merge forever.
      - run: cfn-lint templates/*.yaml
