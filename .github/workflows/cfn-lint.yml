name: cfn-lint

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      # Errors fail the check. Warnings are reported but do not block, since
      # several are unavoidable for parameters whose values are only known at
      # deploy time.
      - run: cfn-lint templates/*.yaml --non-zero-exit-code error
